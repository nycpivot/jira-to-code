apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-to-code
spec:
  replicas: 1
  selector:
    matchLabels: { app: jira-to-code }
  template:
    metadata:
      labels: { app: jira-to-code }
    spec:
      containers:
      - name: api
        image: 806869445083.dkr.ecr.us-east-1.amazonaws.com/private/jira-to-code:latest
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "500m", memory: "512Mi" }
        livenessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jira-to-code
spec:
  selector:
    app: jira-to-code
  ports:
    - port: 80
      targetPort: 8080
